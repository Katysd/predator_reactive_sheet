name: Deploy to GitHub Pages

on:
  push:
    branches: [master, beta]

permissions:
  contents: write # Required to push to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and Build 🏗️
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Your build output folder
          branch: gh-pages # The branch where files will live
          # If branch is beta, put in /beta folder. If master, put in root.
          target-folder: ${{ github.ref_name == 'beta' && 'beta' || '' }}
          # Only 'clean' (delete old files) when deploying master
          clean: ${{ github.ref_name == 'master' }}
